[package]
name = "xdsign"
version = "0.0.9"
edition = "2021"

[lib]
name = "xdsign"
crate-type = ["lib", "cdylib", "staticlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["cxlib/completion-all", "cxlib/ui_solver"]
completion = ["cxlib/completion"]

[dependencies]
# tikv-jemallocator = "0.5"
clap = { version = "4.5" }
cxlib = { git = "https://github.com/worksoup/cxlib.git" }
# cxsign = { path = "../newsign/" }
env_logger = "0.11"
indicatif = "0.17"
indicatif-log-bridge = "0.2"
log = { version = "0.4", features = ["release_max_level_info"] }
wnewtype = { git = "https://github.com/worksoup/wnewtype.git" }
x_l4rs = { git = "https://github.com/learturely/x_l4rs.git", default-features = false, features = ["cxlib_integrated"] }
xddcc = { git = "https://github.com/learturely/xddcc.git" }
xdsign_data = { git = "https://github.com/learturely/xdsign_data.git" }

[profile.release]
panic = "abort"
#codegen-units = 1
#lto = "fat"
strip = "symbols"

[build-dependencies]
resvg = "0.45"
ico = "0.4"
embed-resource = "3.0"